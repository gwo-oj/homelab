[tools]
kubectl     = "1.37.1"
helm        = "4.3.1"
kustomize   = "5.8.3"
flux2       = "2.9.6"
k9s         = "0.51.0"
stern       = "1.35.0"
sops        = "3.13.3"
age         = "1.3.2"
kubeconform = "0.8.0"
yq          = "4.54.1"
# mise installs pypi tools like ansible through uv
uv          = "0.13.5"
ansible     = "14.5.0"
"pipx:yamllint" = "1.38.0"
task        = "3.54.0"
"github-cli" = "2.103.2"
# yaml-language-server in nvim needs node
node        = "24.22.1"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
