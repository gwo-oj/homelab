---
# Pin the node IP. k3s bakes it into certs and etcd peer URLs, so a DHCP
# change would break the cluster. Also reserve it on the router.
#
# Uses `nmcli connection modify` rather than the nmcli module: the module
# wants to own the whole connection (it requires the SSID for WiFi), and we
# only want to touch the IPv4 settings.
#
# Safe when run locally. Over SSH this can drop the connection, so for new
# nodes it's easier to set the IP during the Ubuntu install.

- name: Check required vars
  ansible.builtin.assert:
    that:
      - node_iface | default('') | length > 0
      - node_nm_connection | default('') | length > 0

- name: Read current IPv4 config
  ansible.builtin.command: nmcli -t -f ipv4.method,ipv4.addresses connection show "{{ node_nm_connection }}"
  register: nm_current
  changed_when: false
  check_mode: false

- name: Check if already static
  ansible.builtin.set_fact:
    network_already_static: >-
      {{ 'ipv4.method:manual' in nm_current.stdout
         and (ansible_host ~ '/' ~ node_prefix) in nm_current.stdout }}

- name: Report planned change
  ansible.builtin.debug:
    msg: "Would switch {{ node_nm_connection }} to {{ ansible_host }}/{{ node_prefix }} via {{ node_gateway }}"
  when: ansible_check_mode and not network_already_static

- name: Set static IP
  when: not network_already_static and not ansible_check_mode
  block:
    - name: Back up NetworkManager connections
      ansible.builtin.copy:
        src: /etc/NetworkManager/system-connections/
        dest: "/root/netbackup-{{ ansible_facts['date_time']['epoch'] }}/"
        remote_src: true
        mode: preserve
      failed_when: false

    - name: Switch to manual addressing
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ node_nm_connection }}"
          - ipv4.method
          - manual
          - ipv4.addresses
          - "{{ ansible_host }}/{{ node_prefix }}"
          - ipv4.gateway
          - "{{ node_gateway }}"
          - ipv4.dns
          - "{{ node_dns | join(',') }}"
          - ipv4.may-fail
          - "no"
          - ipv4.route-metric
          - "100"
          - connection.autoconnect
          - "yes"
      changed_when: true

    - name: Bring connection up
      ansible.builtin.command: nmcli connection up "{{ node_nm_connection }}"
      changed_when: true

    - name: Wait for the link to settle
      ansible.builtin.wait_for:
        timeout: 8

    - name: Verify address
      ansible.builtin.command: ip -4 addr show {{ node_iface }}
      register: ip_check
      changed_when: false
      failed_when: (ansible_host ~ '/' ~ node_prefix) not in ip_check.stdout

    - name: Verify gateway
      ansible.builtin.command: ping -c3 -W3 -I {{ node_iface }} {{ node_gateway }}
      changed_when: false

    - name: Verify internet
      ansible.builtin.command: ping -c3 -W5 {{ network_verify_host }}
      changed_when: false

    - name: Verify DNS
      ansible.builtin.command: getent hosts {{ network_verify_dns }}
      changed_when: false

  rescue:
    - name: Roll back to DHCP
      ansible.builtin.command:
        argv: [nmcli, connection, modify, "{{ node_nm_connection }}",
               ipv4.method, auto, ipv4.addresses, "", ipv4.gateway, "",
               ipv4.dns, "", ipv4.may-fail, "yes"]
      changed_when: true
      when: network_rollback_on_failure

    - name: Bring connection back up
      ansible.builtin.command: nmcli connection up "{{ node_nm_connection }}"
      changed_when: true
      when: network_rollback_on_failure

    - name: Fail
      ansible.builtin.fail:
        msg: >-
          Static IP setup failed and was rolled back to DHCP.
          Backup is in /root/netbackup-*.
