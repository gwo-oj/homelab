---
k3s_install_url: https://get.k3s.io
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s

# Flux installs these instead. Names match the files in
# /var/lib/rancher/k3s/server/manifests/.
k3s_disable:
  - traefik
  - metrics-server
  # Envoy Gateway ships its own Gateway API CRDs; two owners would fight.
  - gateway-api-crd

# Bind controller-manager/scheduler/proxy metrics on all interfaces so
# Prometheus can scrape them. Revisit if the node is ever exposed.
k3s_expose_metrics: true
