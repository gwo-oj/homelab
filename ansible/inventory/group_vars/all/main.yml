---
cluster_name: homeserver
cluster_domain: home.arpa
timezone: Asia/Seoul

node_prefix: 24
node_gateway: 192.168.0.1
# Don't point this at AdGuard; the node needs DNS before the cluster is up.
node_dns:
  - 1.1.1.1
  - 1.0.0.1

github_user: gwo-oj
github_repo: homelab
github_branch: main

k3s_version: v1.37.1+k3s1
k3s_api_port: 6443
k3s_snapshot_cron: "0 */6 * * *"
k3s_snapshot_retention: 20
k3s_system_reserved: "cpu=200m,memory=512Mi,ephemeral-storage=2Gi"
k3s_kube_reserved: "cpu=200m,memory=512Mi,ephemeral-storage=2Gi"
k3s_node_labels:
  - "homelab.io/gpu=intel-igpu"
  - "intel.feature.node.kubernetes.io/gpu=true"
