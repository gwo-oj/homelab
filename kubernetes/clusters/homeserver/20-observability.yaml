---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 20m
  path: ./kubernetes/observability
  prune: true
  # Don't hold up apps if Grafana is slow to start.
  wait: false
  dependsOn:
    - name: infrastructure-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
