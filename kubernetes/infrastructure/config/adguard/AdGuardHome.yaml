---
# Copied over the live config on every start, so this file is the source
# of truth. Changes made in the web UI are lost on restart.
# The admin password hash is filled in from the adguard-admin secret.
http:
  address: 0.0.0.0:3000
  session_ttl: 720h
users:
  - name: admin
    password: __ADMIN_PASSWORD_HASH__
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  upstream_dns:
    - https://dns.cloudflare.com/dns-query
    - https://dns.quad9.net/dns-query
  bootstrap_dns:
    - 1.1.1.1
    - 9.9.9.9
  cache_size: 4194304
filtering:
  protection_enabled: true
  filtering_enabled: true
  rewrites_enabled: true
  rewrites:
    - domain: ${CLUSTER_DOMAIN}
      answer: ${NODE_IP}
      enabled: true
    - domain: "*.${CLUSTER_DOMAIN}"
      answer: ${NODE_IP}
      enabled: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
querylog:
  enabled: true
  interval: 168h
statistics:
  enabled: true
  interval: 168h
schema_version: 34
