---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - secret.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  - name: adguard-config
    files:
      - AdGuardHome.yaml
generatorOptions:
  disableNameSuffixHash: true
