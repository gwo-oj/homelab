# Appended to an existing ~/.tmux.conf, so only additions here.

set -ga status-right " #(kubectl config current-context 2>/dev/null)"

# prefix+K: k9s with a flux watch beside it
bind K new-window -n cluster -c "#{pane_current_path}" "k9s" \; \
  split-window -h -l 35% -c "#{pane_current_path}" "watch -n5 flux get kustomizations -A"

# prefix+L: follow flux errors
bind L new-window -n flux-logs "flux logs -A --follow --level=error"
