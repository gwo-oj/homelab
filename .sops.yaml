---
creation_rules:
  # Kubernetes secrets: only encrypt the payload so Flux and kustomize can
  # still read kind/metadata.
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: "^(data|stringData)$"
    mac_only_encrypted: true
    age: >-
      age1t7s3yggfdathcw8nsd9slzz882rsxs88x56mvvejaay7s67w9u2sz9eq85

  - path_regex: .*\.sops\.ya?ml$
    mac_only_encrypted: true
    age: >-
      age1t7s3yggfdathcw8nsd9slzz882rsxs88x56mvvejaay7s67w9u2sz9eq85
