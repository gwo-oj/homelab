---
extends: default

rules:
  line-length: disable
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  *.sops.yaml
  *.sops.yml
  kubernetes/clusters/*/flux-system/
  ansible/.collections/
